name: Build Liverary desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Custom build version (X.Y.Z)
        required: true
        type: string
      changes:
        description: 이번 릴리스의 변경 요약 (한국어)
        required: false
        type: string
        default: ""
      publish:
        description: 검증 성공 후 자동 발행
        required: false
        type: boolean
        default: false
      expected_sha:
        description: Expected main commit
        required: false
        type: string
        default: ""
      base_sha:
        description: Main commit before integration
        required: false
        type: string
        default: ""
      upstream_sha:
        description: Integrated stable upstream commit
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_bundle:
    name: Verify and build application bundle
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      base_sha: ${{ inputs.base_sha }}
      release_version: ${{ inputs.version }}
      expected_sha: ${{ inputs.expected_sha }}

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  collect:
    name: Collect reviewed release files
    needs: [desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Prepare updater manifest and checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mv latest-win-x64.yml latest.yml
          rm -f builder-debug.yml
          for file in *; do
            [[ "$file" == SHA256SUMS ]] && continue
            [[ -f "$file" ]] || continue
            sha256sum -- "$file"
          done > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: t3-custom-${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Prepare release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANGES: ${{ inputs.changes }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PUBLISH" == true && ! "$RELEASE_CHANGES" =~ [^[:space:]] ]]; then
            echo "Automatic publication requires a Korean change summary." >&2
            exit 1
          fi
          if [[ -n "$UPSTREAM_SHA" && ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Upstream commit must be a full lowercase SHA." >&2
            exit 1
          fi
          mkdir -p release-metadata
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg changes "$RELEASE_CHANGES" \
            --arg sha "$RELEASE_SHA" \
            --argjson publish "$RELEASE_PUBLISH" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            '{version: $version, changes: $changes, sha: $sha, publish: $publish, upstream_sha: $upstream_sha}' \
            > release-metadata/release.json
      - uses: actions/upload-artifact@v7
        with:
          name: liverary-release-metadata
          path: release-metadata/release.json
          if-no-files-found: error
          retention-days: 7
