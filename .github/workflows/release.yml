name: Build Liverary desktop

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Custom build version (X.Y.Z)
        required: true
        type: string
      changes:
        description: 이번 릴리스의 변경 요약 (한국어)
        required: false
        type: string
        default: ""
      publish:
        description: 검증 성공 후 자동 발행
        required: false
        type: boolean
        default: false
      expected_sha:
        description: Expected main commit
        required: false
        type: string
        default: ""
      base_sha:
        description: Main commit before integration
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-desktop-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.request.outputs.should_release }}
      sha: ${{ steps.request.outputs.sha }}
      expected_sha: ${{ steps.request.outputs.expected_sha }}
      version: ${{ steps.request.outputs.version }}
      changes: ${{ steps.request.outputs.changes }}
      publish: ${{ steps.request.outputs.publish }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      upstream_sha: ${{ steps.request.outputs.upstream_sha }}
    steps:
      - name: Read and validate the committed request
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANGES: ${{ inputs.changes }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          echo 'should_release=false' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Release requests must run on main.' >&2
            exit 1
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --filter=blob:none --depth=2 origin "$SOURCE_SHA"
          request="$RUNNER_TEMP/release-request.json"
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]
            git fetch --no-tags --filter=blob:none --depth=1 origin "$BEFORE_SHA"
            if git diff --quiet --no-ext-diff --no-textconv --no-renames "$BEFORE_SHA" "$SOURCE_SHA" -- .github/liverary-release.json; then
              echo 'No release request changed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            else
              diff_status=$?
              [[ "$diff_status" == 1 ]] || exit "$diff_status"
            fi
          fi
          git cat-file blob "$SOURCE_SHA:.github/liverary-release.json" > "$RUNNER_TEMP/release-manifest.json"
          jq -se '
            length == 1 and (.[0] | type == "object"
              and keys == ["base_sha", "changes", "upstream_sha", "upstream_tag", "version"]
              and all(.[]; type == "string")
              and (.base_sha | test("^[0-9a-f]{40}$"))
              and (.upstream_sha | test("^[0-9a-f]{40}$"))
              and (.upstream_tag | test("^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")))
          ' "$RUNNER_TEMP/release-manifest.json" >/dev/null
          if [[ "$EVENT_NAME" == push ]]; then
            jq '. + {publish: true}' "$RUNNER_TEMP/release-manifest.json" > "$request"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            jq --arg version "$INPUT_VERSION" --arg changes "$INPUT_CHANGES" \
              --arg base "$INPUT_BASE_SHA" \
              --argjson publish "$INPUT_PUBLISH" \
              '. + {version: $version, changes: $changes, base_sha: $base, publish: $publish}' \
              "$RUNNER_TEMP/release-manifest.json" > "$request"
          else
            echo 'Unsupported release event.' >&2
            exit 1
          fi
          jq -e '
            (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              and (.base_sha | test("^([0-9a-f]{40})?$"))
              and (.upstream_sha | test("^[0-9a-f]{40}$"))
              and (.publish | type == "boolean")
              and ((.publish | not) or (.changes | test("\\S") and test("[가-힣]")))
          ' "$request" >/dev/null
          expected_sha=${INPUT_EXPECTED_SHA:-$SOURCE_SHA}
          if [[ "$expected_sha" != "$SOURCE_SHA" ]]; then
            echo 'The release source does not match the expected commit.' >&2
            exit 1
          fi
          base_sha=$(jq -r '.base_sha' "$request")
          upstream_sha=$(jq -r '.upstream_sha' "$request")
          upstream_tag=$(jq -r '.upstream_tag' "$request")
          gh api "repos/pingdotgg/t3code/releases/tags/$upstream_tag" > "$RUNNER_TEMP/upstream-release.json"
          jq -e --arg tag "$upstream_tag" '
            .tag_name == $tag and .draft == false and .prerelease == false
          ' "$RUNNER_TEMP/upstream-release.json" >/dev/null
          tag_sha=$(gh api "repos/pingdotgg/t3code/commits/$upstream_tag" --jq '.sha')
          if [[ "$tag_sha" != "$upstream_sha" ]]; then
            echo 'The upstream tag does not match the committed upstream_sha.' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "$base_sha" != "$BEFORE_SHA" ]]; then
            echo 'The manifest base_sha must match the main commit before this push.' >&2
            exit 1
          fi
          if [[ -z "$base_sha" ]]; then
            base_sha=$(git rev-parse "$SOURCE_SHA^")
          fi
          [[ "$base_sha" != "$SOURCE_SHA" ]]
          for ancestor in "$base_sha" "$upstream_sha"; do
            [[ -z "$ancestor" ]] && continue
            gh api "repos/$GH_REPO/compare/$ancestor...$SOURCE_SHA?per_page=1" > "$RUNNER_TEMP/release-ancestry.json"
            jq -e --arg sha "$ancestor" '
              .base_commit.sha == $sha and (.status == "ahead" or .status == "identical")
            ' "$RUNNER_TEMP/release-ancestry.json" >/dev/null
          done
          delimiter="changes_$(cat /proc/sys/kernel/random/uuid)"
          {
            printf 'should_release=true\nsha=%s\nexpected_sha=%s\n' "$SOURCE_SHA" "$expected_sha"
            printf 'version=%s\npublish=%s\nbase_sha=%s\nupstream_sha=%s\n' \
              "$(jq -r '.version' "$request")" "$(jq -r '.publish' "$request")" "$base_sha" "$upstream_sha"
            printf 'changes<<%s\n' "$delimiter"
            jq -r '.changes' "$request"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Verify and build application bundle
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      release_version: ${{ needs.prepare.outputs.version }}
      expected_sha: ${{ needs.prepare.outputs.expected_sha }}

  cli_linux_x64:
    name: Linux CLI for Windows WSL
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      desktop_artifact: false

  desktop_mac_arm64:
    name: Verify macOS arm64
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      label: macOS arm64
      runner: macos-15
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      launch_check: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [prepare, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      launch_check: true

  collect:
    name: Collect reviewed release files
    needs: [prepare, cli_linux_x64, desktop_mac_arm64, desktop_win_x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Prepare updater manifest and checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mv latest-win-x64.yml latest.yml
          rm -f builder-debug.yml
          for file in *; do
            [[ "$file" == SHA256SUMS ]] && continue
            [[ -f "$file" ]] || continue
            sha256sum -- "$file"
          done > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: liverary-${{ needs.prepare.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Prepare release metadata
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANGES: ${{ needs.prepare.outputs.changes }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_PUBLISH: ${{ needs.prepare.outputs.publish }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PUBLISH" == true && ! "$RELEASE_CHANGES" =~ [^[:space:]] ]]; then
            echo "Automatic publication requires a Korean change summary." >&2
            exit 1
          fi
          if [[ -n "$UPSTREAM_SHA" && ! "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Upstream commit must be a full lowercase SHA." >&2
            exit 1
          fi
          mkdir -p release-metadata
          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg changes "$RELEASE_CHANGES" \
            --arg sha "$RELEASE_SHA" \
            --argjson publish "$RELEASE_PUBLISH" \
            --arg upstream_sha "$UPSTREAM_SHA" \
            '{version: $version, changes: $changes, sha: $sha, publish: $publish, upstream_sha: $upstream_sha}' \
            > release-metadata/release.json
      - uses: actions/upload-artifact@v7
        with:
          name: liverary-release-metadata
          path: release-metadata/release.json
          if-no-files-found: error
          retention-days: 7
