name: Build T3 Custom desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Custom build version (X.Y.Z)
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_bundle:
    name: Build application bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_RELAY_URL: ""
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_TELEMETRY_ENABLED: "false"
    steps:
      # Public Git checkout avoids credential cleanup traversing orphaned .repos gitlinks.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a stable custom version such as 1.0.0." >&2
            exit 1
          fi
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Set custom build version
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Build application bundle
        run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true

  desktop_win_x64:
    name: Desktop Windows x64
    needs: build_bundle
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true

  collect:
    name: Collect reviewed release files
    needs: [desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Prepare updater manifest and checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mv latest-win-x64.yml latest.yml
          rm -f builder-debug.yml
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: t3-custom-${{ inputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
