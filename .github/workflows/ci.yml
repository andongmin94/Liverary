name: Liverary CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
      base_sha:
        required: false
        type: string
        default: ""
      release_version:
        required: false
        type: string
        default: ""
      expected_sha:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: custom-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Choose CI or release verification
    if: github.event_name == 'push' && inputs.ref == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_requested: ${{ steps.manifest.outputs.release_requested }}
    steps:
      - name: Check release request changes
        id: manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'release_requested=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          route_repo="$RUNNER_TEMP/liverary-ci-route.git"
          git init --bare "$route_repo"
          git -C "$route_repo" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$route_repo" fetch --filter=blob:none --depth=1 --no-tags origin "$SOURCE_SHA" "$BEFORE_SHA"
          if git -C "$route_repo" diff --quiet "$BEFORE_SHA" "$SOURCE_SHA" -- .github/liverary-release.json; then
            echo 'release_requested=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            [[ "$status" == 1 ]]
            echo 'release_requested=true' >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: route
    if: >-
      !cancelled() &&
      (needs.route.result == 'skipped' ||
        (needs.route.result == 'success' && needs.route.outputs.release_requested != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_RELAY_URL: ""
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      T3CODE_TELEMETRY_ENABLED: "false"
    steps:
      # Public source checkout needs no persisted credentials.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref || github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          # check:changed needs the full history to resolve its base commit.
          git fetch --no-tags --filter=blob:none origin "$CHECKOUT_REF"
          git -c checkout.workers=0 checkout --detach FETCH_HEAD
          if [[ -n "$EXPECTED_SHA" && "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out commit does not match the expected source commit." >&2
            exit 1
          fi
      - name: Validate release version
        if: inputs.release_version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Release builds must run on main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Use a new stable custom version (X.Y.Z)." >&2
            exit 1
          fi
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION" \
            --jq "map(select(.ref == \"refs/tags/v$RELEASE_VERSION\")) | length")
          if [[ "$tag_count" != 0 ]]; then
            echo "Release tag v$RELEASE_VERSION already exists. Choose a new version." >&2
            exit 1
          fi
      - name: Select verification for changed files
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
          FULL_BUILD: ${{ inputs.release_version != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            BASE_SHA=2359643cffa6ba9ee84d6f2694b935de54a8013e
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$FULL_BUILD" == true ]]; then
            echo 'build_desktop=true' >> "$GITHUB_OUTPUT"
            echo 'prepare_runtime=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --no-renames -z "$BASE_SHA...HEAD" -- . ':(exclude).repos' |
              node .github/scripts/ci-changes.cjs >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile
      - name: Install native build dependencies
        if: steps.scope.outputs.prepare_runtime == 'true'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Ensure Electron runtime
        if: steps.scope.outputs.prepare_runtime == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Install test browser
        if: steps.scope.outputs.prepare_runtime == 'true'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Check changed files
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: vp run check:changed "$BASE_SHA" --concurrency 2 --timeout 3600
      - name: Set custom build version
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
      - name: Build desktop application
        if: steps.scope.outputs.build_desktop == 'true'
        run: vp run build:desktop
      - name: Verify built web startup
        if: steps.scope.outputs.build_desktop == 'true'
        run: node apps/web/scripts/verify-built-boot.ts
      - uses: actions/upload-artifact@v7
        if: inputs.release_version != ''
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1
