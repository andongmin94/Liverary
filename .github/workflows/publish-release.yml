name: Publish Liverary release

on:
  workflow_run:
    workflows: [Build Liverary desktop]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Liverary desktop run ID
        required: true
        type: string
      version:
        description: Version used by that build (X.Y.Z)
        required: true
        type: string
      changes:
        description: 이번 릴리스의 변경 요약 (한국어)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: liverary-publish-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
    outputs:
      published: ${{ steps.publication.outputs.published }}
      version: ${{ steps.build.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANGES: ${{ inputs.changes }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Resolve verified build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          build_sha=$(jq -er --arg repo "$GH_REPO" '
            select(.repository.full_name == $repo
              and .head_repository.full_name == $repo
              and .head_branch == "main"
              and .path == ".github/workflows/release.yml"
              and .status == "completed"
              and .conclusion == "success")
            | .head_sha
          ' "$RUNNER_TEMP/build-run.json")
          gh api --paginate "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            if ! jq -se 'map(.artifacts) | add | any(.name == "liverary-release-metadata" and .expired == false)' "$RUNNER_TEMP/build-artifacts.json" >/dev/null; then
              echo '발행 메타데이터가 없는 실행이므로 자동 발행하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          gh run download "$BUILD_RUN_ID" --name liverary-release-metadata --dir "$RUNNER_TEMP/liverary-release-metadata"
          metadata="$RUNNER_TEMP/liverary-release-metadata/release.json"
          jq -e --arg sha "$build_sha" '
            .sha == $sha
              and (.version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              and (.publish | type == "boolean")
              and (.changes | type == "string")
              and (.upstream_sha | test("^([0-9a-f]{40})?$"))
          ' "$metadata" >/dev/null
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            if ! jq -e '.publish' "$metadata" >/dev/null; then
              echo '이 빌드는 자동 발행을 선택하지 않았습니다.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            RELEASE_VERSION=$(jq -r '.version' "$metadata")
            RELEASE_CHANGES=$(jq -r '.changes' "$metadata")
          elif [[ "$RELEASE_VERSION" != "$(jq -r '.version' "$metadata")" ]]; then
            echo 'The requested version does not match the verified build.' >&2
            exit 1
          fi
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ ! "$RELEASE_CHANGES" =~ [^[:space:]] ]]; then
            echo '이번 릴리스의 변경 요약을 한국어로 입력하세요.' >&2
            exit 1
          fi
          jq --arg changes "$RELEASE_CHANGES" '.changes = $changes' "$metadata" > "$RUNNER_TEMP/release-input.json"
          artifact_name=$(jq -ser --arg current "liverary-$RELEASE_VERSION" --arg legacy "t3-custom-$RELEASE_VERSION" '
            map(.artifacts) | add | map(select(.expired == false))
            | ([.[] | select(.name == $current)] + [.[] | select(.name == $legacy)])
            | first.name
          ' "$RUNNER_TEMP/build-artifacts.json")

          current_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          [[ "$current_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          python3 - "${current_tag#v}" "$RELEASE_VERSION" <<'PY'
          import sys
          current, proposed = (tuple(map(int, value.split('.'))) for value in sys.argv[1:])
          if proposed <= current:
              sys.exit('The new version must be newer than the latest published Liverary release.')
          PY

          gh api --paginate "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -s --arg tag "v$RELEASE_VERSION" 'add | map(select(.tag_name == $tag)) | first // null' \
            "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/existing-release.json"
          resume_draft=false
          if jq -e '. != null' "$RUNNER_TEMP/existing-release.json" >/dev/null; then
            jq -e --arg sha "$build_sha" --arg marker "<!-- liverary-build:$BUILD_RUN_ID -->" \
              '.draft == true and .target_commitish == $sha and ((.body // "") | startswith($marker))' \
              "$RUNNER_TEMP/existing-release.json" >/dev/null
            resume_draft=true
          fi
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION" \
            --jq "map(select(.ref == \"refs/tags/v$RELEASE_VERSION\")) | length")
          if [[ "$tag_count" != 0 ]]; then
            [[ "$resume_draft" == true ]]
            test "$(gh api "repos/$GH_REPO/commits/v$RELEASE_VERSION" --jq '.sha')" = "$build_sha"
          fi
          {
            printf 'publish=true\nsha=%s\nversion=%s\nrun_id=%s\nresume_draft=%s\n' \
              "$build_sha" "$RELEASE_VERSION" "$BUILD_RUN_ID" "$resume_draft"
            printf 'artifact_name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download verified release files
        if: steps.build.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: release-assets
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check release files
        if: steps.build.outputs.publish == 'true'
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "Liverary-$RELEASE_VERSION-x64.exe" \
            "Liverary-$RELEASE_VERSION-x64.exe.blockmap" \
            "t3-$RELEASE_VERSION-linux-x64.tar.gz" \
            "t3-$RELEASE_VERSION-win32-x64.zip"; do
            test -s "$file"
          done
          if [[ '${{ steps.build.outputs.artifact_name }}' == liverary-* ]]; then
            test -s "liverary-$RELEASE_VERSION-linux-x64.tar.gz"
            test -s "liverary-$RELEASE_VERSION-win32-x64.zip"
          fi
          grep -Fxq "version: $RELEASE_VERSION" latest.yml
          sha256sum --check SHA256SUMS

      - name: Create release with verified assets
        if: steps.build.outputs.publish == 'true'
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          RESUME_DRAFT: ${{ steps.build.outputs.resume_draft }}
          ARTIFACT_NAME: ${{ steps.build.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          CLI_PREFIX=t3
          if [[ "$ARTIFACT_NAME" == liverary-* ]]; then CLI_PREFIX=liverary; fi
          RELEASE_CHANGES=$(jq -r '.changes' "$RUNNER_TEMP/release-input.json")
          printf '<!-- liverary-build:%s -->\n\n## 이번 버전의 변경 사항\n\n%s\n\n' \
            "$BUILD_RUN_ID" "$RELEASE_CHANGES" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Liverary 소개

          Liverary는 에이전트와 지식이 함께 자라는 ‘살아 있는 도서관’이라는 뜻을 담은 한국어 중심의 개인 작업 공간입니다. 오픈소스 T3 Code를 기반으로 합니다.

          ### 기본 제공 기능

          - Liverary 이름·심볼·앱 아이콘, 화이트·중립 회색·블루 중심의 밝은 테마와 차콜 다크 테마를 제공합니다.
          - 한글 글꼴 기본값과 시작·연결·프로젝트·오류 화면의 한국어 안내를 제공합니다.
          - 앱 정보에 원본 모바일 앱 설치 안내를 표시하지 않습니다.
          - 직접 선택한 테마·글꼴과 기존 데이터를 이어서 사용합니다. 업데이트는 이 저장소에서 제공합니다.

          ## 설치

          - Windows x64: Liverary-$RELEASE_VERSION-x64.exe
          - Windows CLI: $CLI_PREFIX-$RELEASE_VERSION-win32-x64.zip
          - Linux·WSL CLI: $CLI_PREFIX-$RELEASE_VERSION-linux-x64.tar.gz

          ## 사용 안내

          기본 로컬 실행에는 T3 Connect 계정이 필요하지 않습니다. Codex·Claude 등 AI 제공자의 인증은 필요합니다.
          T3 사용 통계는 실행 시 기본으로 꺼져 있으며, 원본 저장소 별표 요청을 제거했습니다. 재설치·오류 신고와 개인정보 안내는 커스텀 저장소를 사용합니다.
          주요 데스크톱·로컬 웹 화면을 한국어화했으며, 일부 고급 화면과 제공자 메시지에는 영어가 남아 있습니다.
          Windows 코드 서명 인증서는 설정하지 않았습니다. macOS arm64는 CI에서 앱 실행을 검증하며 공개 설치 파일은 제공하지 않습니다. Linux 데스크톱 설치 파일은 더 이상 배포하지 않습니다.

          [사용 방법과 업데이트 절차](https://github.com/$GH_REPO/blob/main/README.md)

          ## 빌드 정보

          - 소스 커밋: [$BUILD_SHA](https://github.com/$GH_REPO/commit/$BUILD_SHA)
          - 검증된 빌드: [#$BUILD_RUN_ID](https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID)
          - 설치 파일과 업데이트 메타데이터는 위 빌드의 결과물을 그대로 사용합니다.
          EOF
          if [[ "$RESUME_DRAFT" == true ]]; then
            gh release upload "v$RELEASE_VERSION" release-assets/* --clobber
            gh release edit "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "v$RELEASE_VERSION" release-assets/* \
              --target "$BUILD_SHA" \
              --title "Liverary $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --draft
          fi

      - name: Publish release
        id: publication
        if: steps.build.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Complete the upstream update issue
        if: steps.build.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=$(jq -r '.upstream_sha' "$RUNNER_TEMP/release-input.json")
          if [[ -n "$upstream_sha" ]]; then
            gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" > "$RUNNER_TEMP/open-issues.json"
            jq -sr --arg sha "$upstream_sha" 'add | .[] | select(.pull_request == null and .user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- liverary-upstream-update -->") and contains($sha))) | .number' \
              "$RUNNER_TEMP/open-issues.json" | while read -r number; do
                gh issue close "$number" --reason completed
              done
          fi
          printf '## Liverary %s 발행 완료\n\n[설치 파일과 업데이트 안내](%s/%s/releases/tag/v%s)\n' \
            "$RELEASE_VERSION" "$GITHUB_SERVER_URL" "$GH_REPO" "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  retire:
    name: Mark previous releases discontinued
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.publish.outputs.version }}
    steps:
      - name: Mark older stable releases as discontinued
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/.github/scripts/retire-releases.cjs?ref=$GITHUB_SHA" \
            --jq '.content' | base64 --decode > "$RUNNER_TEMP/retire-releases.cjs"
          node "$RUNNER_TEMP/retire-releases.cjs" "$RELEASE_TAG"
