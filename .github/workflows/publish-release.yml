name: Publish Liverary release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Liverary desktop run ID
        required: true
        type: string
      version:
        description: Version used by that build (X.Y.Z)
        required: true
        type: string
      changes:
        description: 이번 릴리스의 변경 요약 (한국어)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: custom-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CHANGES: ${{ inputs.changes }}
    steps:
      - name: Resolve verified build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ ! "$RELEASE_CHANGES" =~ [^[:space:]] ]]; then
            echo "이번 릴리스의 변경 요약을 한국어로 입력하세요." >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          build_sha=$(jq -er --arg repo "$GH_REPO" '
            select(.repository.full_name == $repo
              and .head_repository.full_name == $repo
              and .head_branch == "main"
              and .path == ".github/workflows/release.yml"
              and .status == "completed"
              and .conclusion == "success")
            | .head_sha
          ' "$RUNNER_TEMP/build-run.json")
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&head_sha=$build_sha&per_page=1" \
            > "$RUNNER_TEMP/ci-runs.json"
          if ! jq -e --arg sha "$build_sha" '
            .workflow_runs[0]
            | .head_sha == $sha
              and .status == "completed"
              and .conclusion == "success"
          ' "$RUNNER_TEMP/ci-runs.json" >/dev/null; then
            echo "Latest Liverary CI run for $build_sha must complete successfully before publishing." >&2
            jq -r '.workflow_runs[0] | "Latest CI: \(.html_url // "not found") (\(.status // "missing") / \(.conclusion // "none"))"' \
              "$RUNNER_TEMP/ci-runs.json" >&2
            exit 1
          fi
          tag_count=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION" \
            --jq "map(select(.ref == \"refs/tags/v$RELEASE_VERSION\")) | length")
          if [[ "$tag_count" != 0 ]]; then
            echo "Release tag v$RELEASE_VERSION already exists. Choose a new version." >&2
            exit 1
          fi
          echo "sha=$build_sha" >> "$GITHUB_OUTPUT"

      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: t3-custom-${{ inputs.version }}
          path: release-assets
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Check release files
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            "Liverary-$RELEASE_VERSION-x64.exe" \
            "Liverary-$RELEASE_VERSION-x64.exe.blockmap" \
            "Liverary-$RELEASE_VERSION-x86_64.AppImage" \
            "Liverary-$RELEASE_VERSION-amd64.deb"; do
            test -s "$file"
          done
          grep -Fxq "version: $RELEASE_VERSION" latest.yml
          grep -Fxq "version: $RELEASE_VERSION" latest-linux.yml
          sha256sum --check SHA256SUMS

      - name: Create release with verified assets
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## 이번 버전의 변경 사항\n\n%s\n\n' "$RELEASE_CHANGES" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Liverary 소개

          Liverary는 에이전트와 지식이 함께 자라는 ‘살아 있는 도서관’이라는 뜻을 담은 한국어 중심의 개인 작업 공간입니다. 오픈소스 T3 Code를 기반으로 합니다.

          ### 기본 제공 기능

          - Liverary 이름·심볼·앱 아이콘, 화이트·중립 회색·블루 중심의 밝은 테마와 차콜 다크 테마를 제공합니다.
          - 한글 글꼴 기본값과 시작·연결·프로젝트·오류 화면의 한국어 안내를 제공합니다.
          - 앱 정보에 원본 모바일 앱 설치 안내를 표시하지 않습니다.
          - 기존 T3 Custom의 앱 식별자·데이터 폴더·업데이트 저장소를 유지합니다. 직접 선택한 테마와 글꼴도 유지합니다.

          ## 설치

          - Windows x64: Liverary-$RELEASE_VERSION-x64.exe
          - Linux AppImage: Liverary-$RELEASE_VERSION-x86_64.AppImage
          - Ubuntu·Debian 계열: Liverary-$RELEASE_VERSION-amd64.deb
          - CLI: 운영체제에 맞는 t3-$RELEASE_VERSION 압축 파일

          ## 사용 안내

          기본 로컬 실행에는 T3 Connect 계정이 필요하지 않습니다. Codex·Claude 등 AI 제공자의 인증은 필요합니다.
          T3 사용 통계는 실행 시 기본으로 꺼져 있으며, 원본 저장소 별표 요청을 제거했습니다. 재설치·오류 신고와 개인정보 안내는 커스텀 저장소를 사용합니다.
          주요 데스크톱·로컬 웹 화면을 한국어화했으며, 일부 고급 화면과 제공자 메시지에는 영어가 남아 있습니다.
          Windows 코드 서명 인증서는 설정하지 않았으며, macOS 설치 파일은 포함하지 않습니다.

          [사용 방법과 업데이트 절차](https://github.com/$GH_REPO/blob/main/README.md)

          ## 빌드 정보

          - 소스 커밋: [$BUILD_SHA](https://github.com/$GH_REPO/commit/$BUILD_SHA)
          - 검증된 빌드: [#$BUILD_RUN_ID](https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID)
          - 설치 파일과 업데이트 메타데이터는 위 빌드의 결과물을 그대로 사용합니다.
          EOF
          gh release create "v$RELEASE_VERSION" release-assets/* \
            --target "$BUILD_SHA" \
            --title "Liverary $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft

      - name: Publish release
        run: gh release edit "v$RELEASE_VERSION" --draft=false --latest
