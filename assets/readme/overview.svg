<rect x="40" y="384" width="236" height="20" rx="10" class="chip"/><text x="158" y="398" class="chip-text" text-anchor="middle">로컬 사용 시 앱이 서버를 함께 시작</text>
<text x="40" y="440" class="sub">앱 계정·회원 가입 없이 사용합니다. 서버 접속 인증과 AI 제공자 로그인은 각각 유지됩니다.</text>
